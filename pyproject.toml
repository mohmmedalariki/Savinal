[project]
name = "savinal"
version = "0.1.0"
description = "A production-ready Telegram bot for video downloads"
authors = [{name = "Savinal Dev", email = "dev@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=20.0",
    "yt-dlp>=2023.10.0",
    "aiohttp>=3.9.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
